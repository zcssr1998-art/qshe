<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="妻社">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://img.qsimg26515.org.cn/img/fqrzjy.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17a6d0">
<title>妻社</title>
<style>

:root{
  --acc:#14b886; --acc2:#0f9e73;
  --bg:#f2f4f5; --card:#fff;
  --tx:#1a1a1a; --tx2:#8a8f94; --line:#eceef0;
  --hdr:linear-gradient(100deg,#2ec49b 0%,#17a6d0 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:calc(58px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
img{display:block;border:0}
button{font-family:inherit;cursor:pointer}
#app{max-width:750px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative}

/* ── 顶栏 ── */
#hdr{position:sticky;top:0;z-index:30;background:var(--hdr)}
#hdr .bar{display:flex;align-items:center;gap:9px;padding:9px 12px 7px}
#hdr .logo{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);flex:none;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
#hdr .logo img{width:22px;height:22px;object-fit:contain}
#hdr .sbox{flex:1;min-width:0;height:32px;border-radius:17px;background:#fff;display:flex;align-items:center;
  gap:6px;padding:0 12px}
#hdr .sbox .ic{font-size:13px;opacity:.55;flex:none}
#hdr .sbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13px;color:#333}
#hdr .sbox input::placeholder{color:#a8adb2}
#hdr .me{width:30px;height:30px;border-radius:50%;flex:none;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
#hdr .tabs{display:flex;align-items:center;gap:20px;padding:0 14px 9px;overflow-x:auto;scrollbar-width:none}
#hdr .tabs::-webkit-scrollbar{display:none}
#hdr .tabs button{background:none;border:0;padding:0 0 5px;color:#fff;opacity:.86;font-size:15px;
  white-space:nowrap;position:relative;flex:none}
#hdr .tabs button.on{opacity:1;font-weight:700}
#hdr .tabs button.on::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:18px;height:2.5px;border-radius:2px;background:#fff}

/* ── 九宫格 ── */
#grid{background:var(--card);display:grid;grid-template-columns:repeat(4,1fr);
  padding:12px 4px 8px;margin-bottom:8px}
#grid a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2px;text-decoration:none}
#grid a img{width:36px;height:36px;border-radius:10px;object-fit:cover;background:#f0f2f3}
#grid a span{font-size:11.5px;color:#666;line-height:1.2;text-align:center}

/* ── 帖子卡片 ── */
.card{background:var(--card);padding:12px 12px 0;margin-bottom:8px}
.card .u{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.card .u .av{width:34px;height:34px;border-radius:50%;flex:none;object-fit:cover;background:#e9ecee}
.card .u .meta{flex:1;min-width:0}
.card .u .l1{display:flex;align-items:center;gap:6px;min-width:0}
.card .u .nm{font-size:13.5px;color:#1a1a1a;font-weight:600;max-width:130px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.card .u .bg{font-size:10px;line-height:1.5;padding:0 5px;border-radius:4px;color:#fff;flex:none;
  white-space:nowrap;transform:scale(.95);transform-origin:left center}
.card .u .dt{font-size:11.5px;color:#a8adb2;margin-top:1px}
.card .u .flw{border:1px solid var(--acc);color:var(--acc);background:none;font-size:11.5px;
  padding:3px 10px;border-radius:12px;flex:none}
.card h3{margin:0 0 6px;font-size:16px;line-height:1.42;font-weight:600;color:#141414;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .sum{margin:0 0 9px;font-size:13px;line-height:1.55;color:#8a8f94;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .media{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;overflow:hidden;border-radius:2px}
.card .media.one{grid-template-columns:1fr}
.card .media.two{grid-template-columns:repeat(2,1fr)}
.card .media .cel{position:relative;background:#eef1f2;aspect-ratio:1/1;overflow:hidden}
.card .media .cel img{width:100%;height:100%;object-fit:cover}
.card .media .cel .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card .media .cel .play i{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.42);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;
  border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(3px);font-style:normal;padding-left:3px}
.card .media .cel .dur{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.55);
  color:#fff;font-size:10.5px;padding:1px 5px;border-radius:3px;font-variant-numeric:tabular-nums}
.card .ft{display:flex;align-items:center;gap:10px;padding:9px 0 11px;font-size:12px;color:#9aa1a6}
.card .ft .cat{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#7d8489}
.card .ft .n{display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.card .ft .n i{font-style:normal;font-size:12px;opacity:.75}

/* ── 骨架 / 加载 ── */
.sk{background:linear-gradient(90deg,#eceff0,#f6f8f8,#eceff0);background-size:200% 100%;
  animation:skm 1.2s linear infinite}
@keyframes skm{to{background-position:-200% 0}}
.skel{background:#fff;padding:12px;margin-bottom:8px}
.skel .a{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.skel .a div:first-child{width:34px;height:34px;border-radius:50%}
.skel .a div:last-child{width:110px;height:13px;border-radius:4px}
.skel .b{height:17px;border-radius:4px;margin-bottom:7px;width:88%}
.skel .c{height:13px;border-radius:4px;width:60%;margin-bottom:11px}
.skel .d{aspect-ratio:1/1;border-radius:3px}
.spn{width:22px;height:22px;border:2.4px solid #d8dee0;border-top-color:var(--acc);border-radius:50%;
  animation:sp .7s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:34px 0;text-align:center}
.end{text-align:center;color:#b0b6ba;font-size:12.5px;padding:22px 0 30px}
.empty{text-align:center;color:#9aa1a6;padding:70px 20px;font-size:14px}
.empty .big{font-size:36px;margin-bottom:12px;opacity:.4}

/* ── 详情页 ── */
#detail{background:#fff;min-height:100vh}
#detail .dh{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:#fff;z-index:20}
#detail .dh button{background:none;border:0;font-size:20px;color:#333;padding:0 4px;line-height:1}
#detail .dh .t{flex:1;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#detail .body{padding:14px 12px 0}
#detail h1{margin:0 0 12px;font-size:18.5px;line-height:1.44;font-weight:700}
#detail .u{display:flex;align-items:center;gap:9px;margin-bottom:16px}
#detail .u .av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#e9ecee}
#detail .u .meta{flex:1;min-width:0}
#detail .u .nm{font-size:13.5px;font-weight:600}
#detail .u .sub{font-size:11.5px;color:#a8adb2;margin-top:2px}
#detail .u .flw{border:1px solid var(--acc);color:var(--acc);background:none;font-size:11.5px;
  padding:4px 12px;border-radius:12px}
#detail .txt{font-size:15px;line-height:1.72;color:#2a2d2f;white-space:pre-wrap;word-break:break-word}
#detail .tags{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
#detail .tags span{font-size:11.5px;color:#8a8f94;background:#f3f5f6;padding:3px 9px;border-radius:11px}
#detail .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:14px 0}
#detail .gal .cel{position:relative;background:#eef1f2;aspect-ratio:1/1;overflow:hidden;border-radius:2px}
#detail .gal .cel img{width:100%;height:100%;object-fit:cover}
#detail .gal .cel .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#detail .gal .cel .play i{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-style:normal;
  border:1px solid rgba(255,255,255,.5);padding-left:3px}
#detail .stat{display:flex;align-items:center;gap:16px;padding:12px 0 14px;border-top:1px solid var(--line);
  margin-top:6px;font-size:12.5px;color:#9aa1a6}
#detail .stat .n{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
#detail .rh{display:flex;align-items:center;gap:12px;padding:13px 12px;border-top:8px solid var(--bg);
  font-size:14px;font-weight:600}
#detail .rh .c{color:#9aa1a6;font-weight:400;font-size:12.5px}
.rep{padding:13px 12px;border-bottom:1px solid #f4f6f7}
.rep .u{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.rep .u .av{width:29px;height:29px;border-radius:50%;object-fit:cover;background:#e9ecee}
.rep .u .nm{font-size:12.5px;color:#5c6368;font-weight:600}
.rep .u .no{margin-left:auto;font-size:11.5px;color:#b0b6ba}
.rep .u .dt{font-size:11.5px;color:#b0b6ba}
.rep .m{font-size:14px;line-height:1.65;color:#33383b;white-space:pre-wrap;word-break:break-word}
.rep .f{display:flex;align-items:center;gap:14px;margin-top:8px;font-size:11.5px;color:#b0b6ba}

/* ── 底部 tabBar ── */
#tab{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.98);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  max-width:750px;margin:0 auto;display:flex;align-items:flex-end}
#tab button{flex:1;background:none;border:0;color:#9aa1a6;font-size:10.5px;
  padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px}
#tab button .ic{font-size:19px;line-height:1;opacity:.55}
#tab button.on{color:var(--acc)}
#tab button.on .ic{opacity:1}
#tab button.mid{flex:0 0 62px;padding:0;position:relative}
#tab button.mid .plus{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:300;
  margin:-16px auto 5px;box-shadow:0 3px 12px rgba(20,184,134,.4);line-height:1}

/* ── 图片查看器 ── */
#viewer{position:fixed;inset:0;z-index:95;background:#000;display:none;align-items:center;
  justify-content:center}
#viewer.on{display:flex}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}
#viewer .cl{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;width:36px;
  height:36px;border-radius:50%;background:rgba(255,255,255,.16);border:0;color:#fff;font-size:18px}

/* ── 播放器（沿用 hghub 那套） ── */
#pl{position:fixed;top:0;left:0;width:100%;height:100%;z-index:90;background:#000;display:none;
  overflow:clip;overscroll-behavior:none}
#pl.on{display:block}
#pl .wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#pl video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
#pl .top{position:absolute;top:0;left:0;right:0;z-index:6;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 16px;display:flex;justify-content:space-between;
  align-items:center;gap:8px;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent);
  transition:opacity .22s}
#pl .top button{background:rgba(255,255,255,.14);border:0;color:#fff;width:34px;height:34px;
  border-radius:50%;font-size:16px;line-height:1;flex:none;backdrop-filter:blur(6px)}
#pl .top .nm{flex:1;min-width:0;font-size:13px;color:#fff;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;text-align:center;opacity:.94}
#pl .ctr{position:absolute;left:0;right:0;bottom:0;z-index:6;
  padding:40px 12px calc(env(safe-area-inset-bottom) + 9px);
  background:linear-gradient(0deg,rgba(0,0,0,.88),rgba(0,0,0,.34) 58%,transparent);
  transition:opacity .22s}
#pl.hide-ctl .top,#pl.hide-ctl .ctr{opacity:0;pointer-events:none}
#pl .line{display:flex;align-items:center;gap:8px}
#pl .tm{font-size:11.5px;color:#e6e6ee;font-variant-numeric:tabular-nums;flex:none;
  min-width:38px;text-align:center;opacity:.9}
#pl .sk2{--p:0%;--b:0%;flex:1;-webkit-appearance:none;appearance:none;height:26px;
  background:transparent;outline:none;margin:0;touch-action:none}
#pl .sk2::-webkit-slider-runnable-track{height:4px;border-radius:3px;
  background:linear-gradient(90deg,var(--acc) 0 var(--p),rgba(255,255,255,.32) var(--p) var(--b),
  rgba(255,255,255,.13) var(--b))}
#pl .sk2::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:#fff;margin-top:-4.5px;box-shadow:0 0 0 3px rgba(20,184,134,.45)}
#pl .sk2::-moz-range-track{height:4px;border-radius:3px;
  background:linear-gradient(90deg,var(--acc) 0 var(--p),rgba(255,255,255,.32) var(--p) var(--b),
  rgba(255,255,255,.13) var(--b))}
#pl .sk2::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}
#pl .btns{display:flex;align-items:center;gap:7px;margin-top:5px}
#pl .btns .ep-tg{background:rgba(255,255,255,.12);border:0;color:#fff;font-size:12px;
  padding:7px 11px;border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
#pl .btns .spd{margin-left:auto;font-weight:600}
#pl .btns .fs{background:rgba(255,255,255,.12);border:0;color:#fff;width:34px;height:30px;
  border-radius:8px;font-size:15px;line-height:1;flex:none}
#pl .big-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:5;
  width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.22);color:#fff;font-size:20px;display:flex;align-items:center;
  justify-content:center;backdrop-filter:blur(8px);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s}
#pl .big-play.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#pl .spin-c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;display:none}
#pl .spin-c.on{display:block}
#pl .spdbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);z-index:9;
  background:rgba(18,18,24,.96);border:1px solid rgba(255,255,255,.12);border-radius:14px;
  padding:14px 8px 8px;display:none;min-width:168px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#pl .spdbox.on{display:block}
#pl .spdbox .ttl{font-size:12px;color:#9aa1a6;text-align:center;margin-bottom:9px}
#pl .spdbox .it{display:flex;flex-direction:column;gap:5px}
#pl .spdbox .it button{background:#1f1f28;border:1px solid transparent;color:#dcdce6;border-radius:9px;
  padding:9px 0;font-size:13.5px;font-variant-numeric:tabular-nums}
#pl .spdbox .it button.cur{background:rgba(20,184,134,.18);border-color:var(--acc);color:#fff;font-weight:700}
#pl .spdbox .it button i{font-style:normal;color:#9aa1a6;font-size:11px;margin-left:5px}
#pl .gtoast{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:7;
  background:rgba(0,0,0,.78);color:#fff;font-size:14px;font-weight:600;padding:9px 18px;
  border-radius:22px;opacity:0;transition:opacity .18s;pointer-events:none;
  font-variant-numeric:tabular-nums;backdrop-filter:blur(6px);white-space:nowrap}
#pl .gtoast.on{opacity:1}
#pl .epbox{position:absolute;left:0;right:0;bottom:0;z-index:8;background:#101015;
  border-radius:16px 16px 0 0;padding:12px 0 calc(env(safe-area-inset-bottom) + 12px);
  transform:translateY(101%);transition:transform .26s ease;max-height:62%}
#pl .epbox.on{transform:translateY(0)}
#pl .epbox .hd{display:flex;justify-content:space-between;align-items:center;padding:0 14px 10px;
  font-size:14px;font-weight:700;color:#fff}
#pl .epbox .nav{display:flex;gap:5px;align-items:center}
#pl .epbox .nav .p{color:#9aa1a6;font-size:12px;font-weight:400;background:#1c1c24;
  border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:4px 10px}
#pl .epbox .hd span{color:#9aa1a6;font-size:12px;font-weight:400}
#pl .epbox .bd{max-height:44vh;overflow-y:auto;padding:0 12px}
#pl .epbox .eg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding-bottom:6px}
@media(min-width:560px){#pl .epbox .eg{grid-template-columns:repeat(8,1fr)}}
#pl .epbox .eg button{background:#1c1c24;border:1px solid rgba(255,255,255,.1);color:#dcdce6;
  border-radius:8px;padding:10px 0;font-size:13px;font-variant-numeric:tabular-nums;position:relative}
#pl .epbox .eg button.cur{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
#pl .nx{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;
  background:rgba(0,0,0,.84);border-radius:12px;padding:15px 20px;text-align:center;display:none;
  backdrop-filter:blur(6px)}
#pl .nx.on{display:block}
#pl .nx .a{font-size:13.5px;color:#fff}
#pl .nx .b{margin-top:10px;display:flex;gap:8px;justify-content:center}
#pl .nx .b button{border:0;border-radius:8px;padding:8px 16px;font-size:12.5px}
#pl .nx .b .y{background:var(--acc);color:#fff}
#pl .nx .b .n{background:rgba(255,255,255,.16);color:#fff}
#pl .err{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(0,0,0,.9)}
#pl .err.on{display:flex}
#pl .err .c{background:#17171e;border:1px solid rgba(255,255,255,.12);border-radius:14px;
  padding:20px 18px;max-width:340px;width:100%;text-align:center}
#pl .err .t{font-size:15px;font-weight:700;margin-bottom:6px;color:#fff}
#pl .err .s{font-size:12.5px;color:#9aa1a6;line-height:1.65;margin-bottom:14px}
#pl .err .a{display:flex;gap:8px}
#pl .err .a button{flex:1;border:0;border-radius:9px;padding:10px 0;font-size:13px;
  background:#26262f;color:#fff}
#pl .err .a button.p{background:var(--acc);font-weight:600}

/* ── 板块页 / 列表页 / 搜索页 ── */
#forum,#list{display:none;background:var(--bg);min-height:100vh;padding-bottom:64px}
.lh{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:11px 12px;
  background:#fff;border-bottom:1px solid var(--line)}
.lh button.bk{background:none;border:0;font-size:22px;color:#333;padding:0 2px;line-height:1}
.lh .t{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lh .cnt{font-size:12px;color:#9aa1a6;flex:none}
.fgrp{background:#fff;margin-bottom:8px}
.fgrp h4{margin:0;padding:14px 12px 10px;font-size:13px;color:#6c7378;font-weight:600;
  display:flex;align-items:center;gap:6px}
.fgrp h4::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--acc)}
.fgrp .gl{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 12px 12px}
@media(min-width:560px){.fgrp .gl{grid-template-columns:repeat(3,1fr)}}
.fcard{display:flex;gap:9px;align-items:center;background:#f6f8f9;border-radius:10px;
  padding:9px 10px;text-decoration:none;color:inherit;overflow:hidden}
.fcard img{width:38px;height:38px;border-radius:9px;object-fit:cover;background:#e9ecee;flex:none}

function load(){
  if(S.loading || S.end) return;
  S.loading = true;
  if(S.page === 1) $('#feed').innerHTML = skeleton(3);

  apiGet('post.getIndexList', {
    page: S.page, perpage: S.perpage, mark: '222736jbu99',
    tabmark: S.tabmark, deltag: '', gettag: ''
  }).then(function(j){
    if(!j || j.code != 200 || !j.data){ throw new Error((j && j.msg) || '接口返回异常'); }
    var list = j.data.list || [];
    if(S.page === 1) $('#feed').innerHTML = '';
    if(!list.length){
      S.end = true;
      if(S.page === 1) $('#feed').innerHTML = '<div class="empty"><div class="big">🗒</div>' +
        (S.tab === '关注' ? '关注流需要登录，本站未做登录态' : '这个栏目暂时没有内容') + '</div>';
      else $('#feed').insertAdjacentHTML('beforeend', '<div class="end">— 到底了 —</div>');
      return;
    }
    var h = '';
    list.forEach(function(it){
      S.items.push(it); S.byTid[it.tid] = it;
      h += cardHTML(it);
    });
    $('#feed').insertAdjacentHTML('beforeend', h);
    if(!j.data.nextPage || list.length < S.perpage){
      S.end = true;
      $('#feed').insertAdjacentHTML('beforeend', '<div class="end">— 到底了 —</div>');
    } else {
      S.page++;
    }
  }).catch(function(e){
    console.error(e);
    if(S.page === 1) $('#feed').innerHTML = '<div class="empty"><div class="big">⚠</div>加载失败：' + esc(e.message) + '<br><br>点这里重试' +
      '<br><br><button onclick="location.reload()" style="border:0;background:#14b886;color:#fff;padding:9px 22px;border-radius:20px;font-size:14px">重试</button></div>';
  }).then(function(){
    S.loading = false;
  });
}
function reset(){
  S.page = 1; S.items = []; S.byTid = {}; S.end = false; S.loading = false;
  $('#feed').innerHTML = '';
}

        ''+ flwBtn +'' +

      (body ? '<div class="txt">' + esc(body) + '</div>' : '') +
      tagHTML + gal +

        '<span class="n">💬 ' + num(repN) + '</span>' +

/* ═══════════ 播放器 ═══════════ */
var pl = {
  v: $('#v'), hls: null, list: [], idx: 0, hideT: 0, tapT: 0, tapX: 0, lp: 0, lpOn: false,
  spd: parseFloat(localStorage.getItem('qsh.spd') || '1') || 1
};

var SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];

function openPlayer(list, idx, title){
  pl.list = list || []; pl.idx = idx || 0;
  $('#plName').textContent = title || '';
  $('#pl').classList.add('on');
  document.body.style.overflow = 'hidden';
  buildEp();
  playAt(pl.idx);
  showCtl();
}
function closePlayer(){
  $('#pl').classList.remove('on');
  $('#pl').classList.remove('hide-ctl');
  document.body.style.overflow = '';
  paused3 = 1;
  try{ pl.v.pause(); }catch(e){}
  if(pl.hls){ pl.hls.destroy(); pl.hls = null; }
  pl.v.removeAttribute('src'); pl.v.load();
  $('#nx').classList.remove('on');
  $('#err').classList.remove('on');
}
var paused3 = 1;

function playAt(i){
  var m = pl.list[i];
  if(!m) return;
  pl.idx = i;
  $('#err').classList.remove('on');
  $('#spin').classList.add('on');
  $('#epTg').style.display = pl.list.length > 1 ? '' : 'none';
  if(pl.list.length > 1){
    $('#epTg').textContent = '选集 ' + (i+1) + '/' + pl.list.length;
    $('#epCnt').textContent = (i+1) + '/' + pl.list.length;
    $$('#epGrid button').forEach(function(b, k){ b.classList.toggle('cur', k === i); });
  }
  if(pl.hls){ pl.hls.destroy(); pl.hls = null; }
  var v = pl.v;
  v.pause();
  v.removeAttribute('src');

  if(window.Hls && window.Hls.isSupported()){
    pl.hls = new Hls({ maxBufferLength: 34, maxMaxBufferLength: 70, enableWorker: true, lowLatencyMode: false });
    pl.hls.loadSource(m.url);
    pl.hls.attachMedia(v);
    pl.hls.on(Hls.Events.MANIFEST_PARSED, function(){
      $('#spin').classList.remove('on');
      v.play().catch(function(){ showBigPlay(); });
    });
    pl.hls.on(Hls.Events.ERROR, function(ev, d){
      if(d && d.fatal){
        if(d.type === Hls.ErrorTypes.NETWORK_ERROR){ try{ pl.hls.startLoad(); return; }catch(e){} }
        if(d.type === Hls.ErrorTypes.MEDIA_ERROR){ try{ pl.hls.recoverMediaError(); return; }catch(e){} }
        showErr('分片加载失败，可能是 CDN 需要重试或链接已过期。');
      }
    });
  } else if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.src = m.url;
    v.play().then(function(){ $('#spin').classList.remove('on'); }).catch(function(){ $('#spin').classList.remove('on'); showBigPlay(); });
  } else {
    showErr('这个浏览器不支持 HLS 播放，建议用 Chrome / Edge / Safari。');
    return;
  }
  v.playbackRate = pl.spd;
  $('#spdTg').textContent = pl.spd.toFixed(2).replace(/0$/,'').replace(/\.$/,'') + '×';
}
function showBigPlay(){ $('#bigPlay').classList.add('show'); }
function showErr(msg){
  $('#spin').classList.remove('on');
  $('#errMsg').textContent = msg || '来源不可用。';
  $('#err').classList.add('on');
}

function buildEp(){
  if(pl.list.length < 2){ $('#epGrid').innerHTML = ''; return; }
  var h = '';
  pl.list.forEach(function(m, i){
    h += '<button class="' + (i === pl.idx ? 'cur' : '') + '" data-i="' + i + '">' + (i+1) + '</button>';
  });
  $('#epGrid').innerHTML = h;
}

/* 进度 */
function tick(){
  var v = pl.v;
  if(v.duration && isFinite(v.duration)){
    var p = v.currentTime / v.duration;
    var sk = $('#seek');
    sk.style.setProperty('--p', (p*100).toFixed(2) + '%');
    if(v.buffered.length){
      var b = v.buffered.end(v.buffered.length-1) / v.duration;
      sk.style.setProperty('--b', (Math.min(b,1)*100).toFixed(2) + '%');
    }
    sk.value = Math.round(p*1000);
    $('#tmCur').textContent = fmtT(v.currentTime);
    $('#tmDur').textContent = fmtT(v.duration);
  }
}
setInterval(function(){ if($('#pl').classList.contains('on')) tick(); }, 220);

/* 控制栏显隐 */
function showCtl(){
  $('#pl').classList.remove('hide-ctl');
  clearTimeout(pl.hideT);
  pl.hideT = setTimeout(function(){
    if(!pl.v.paused) $('#pl').classList.add('hide-ctl');
  }, 3200);
}

/* 事件绑定 */
pl.v.addEventListener('waiting', function(){ $('#spin').classList.add('on'); });
pl.v.addEventListener('playing', function(){ $('#spin').classList.remove('on'); $('#bigPlay').classList.remove('show'); });
pl.v.addEventListener('canplay', function(){ $('#spin').classList.remove('on'); });
pl.v.addEventListener('pause', function(){ $('#pl').classList.remove('hide-ctl'); paused3 = 1; });
pl.v.addEventListener('play', function(){ showCtl(); paused3 = 0; });
pl.v.addEventListener('ended', function(){
  if(pl.idx < pl.list.length - 1){ $('#nx').classList.add('on'); }
  else { $('#pl').classList.remove('hide-ctl'); }
});
pl.v.addEventListener('timeupdate', tick);
pl.v.addEventListener('error', function(){ showErr('视频源无法播放（可能是 m3u8 分片 403 或已过期）。'); });

$('#bigPlay').onclick = function(){ pl.v.play().catch(function(){}); };
$('#btnBack').onclick = closePlayer;
$('#btnFs').onclick = fsToggle;
$('#btnFs2').onclick = fsToggle;
function fsToggle(){
  var v = pl.v;
  if(document.fullscreenElement){ document.exitFullscreen(); return; }
  if($('#pl').requestFullscreen){ $('#pl').requestFullscreen().catch(function(){}); }
  else if(v.webkitEnterFullscreen){ v.webkitEnterFullscreen(); }
}

/* seek 拖动 */
var seeking = false;
$('#seek').addEventListener('input', function(){
  seeking = true;
  var v = pl.v;
  if(!v.duration) return;
  var p = this.value / 1000;
  this.style.setProperty('--p', (p*100) + '%');
  $('#tmCur').textContent = fmtT(p * v.duration);
});

  var v = pl.v;
  if(v.duration) v.currentTime = (this.value/1000) * v.duration;

function buildSpd(){

  SPEEDS.forEach(function(s){
    h += '<button class="' + (Math.abs(s - pl.spd) < .01 ? 'cur' : '') + '" data-s="' + s + '">' +

$('#nxY').onclick = function(){ $('#nx').classList.remove('on'); playAt(pl.idx + 1); };
$('#nxN').onclick = function(){ $('#nx').classList.remove('on'); };

/* 手势：单击切控制栏 / 双击左右 10s / 长按 2× */
var stage = $('#pl .wrap');
stage.addEventListener('click', function(e){
  var now = Date.now();
  var w = stage.clientWidth;
  var left = e.clientX < w * 0.35, right = e.clientX > w * 0.65;
  if(now - pl.tapT < 300){
    clearTimeout(pl.tapT_id);
    if(left){ pl.v.currentTime = Math.max(0, pl.v.currentTime - 10); toast('-10 秒'); }
    else if(right){ pl.v.currentTime = Math.min(pl.v.duration || 1e9, pl.v.currentTime + 10); toast('+10 秒'); }
    pl.tapT = 0;
    return;
  }
  pl.tapT = now;
  pl.tapT_id = setTimeout(function(){
    if(pl.lpOn) return;
    var on = $('#pl').classList.toggle('hide-ctl');
    if(!on) showCtl();
  }, 300);
});
stage.addEventListener('pointerdown', function(){
  clearTimeout(pl.lp);
  pl.lp = setTimeout(function(){
    pl.lpOn = true;
    pl.v.playbackRate = 2;
    toast('2× 快放中');
  }, 380);
});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  stage.addEventListener(ev, function(){
    clearTimeout(pl.lp);
    if(pl.lpOn){ pl.lpOn = false; pl.v.playbackRate = pl.spd; }
  });
});
function toast(t){
  var g = $('#gtoast');
  g.textContent = t; g.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ g.classList.remove('on'); }, 700);
}

  $('#fBack').onclick = function(){ showView('home'); setTab('home'); };

  apiGet('forum.getForumByType', { type: 'square' }).then(function(j){
    if(!j || j.code != 200) throw new Error((j && j.msg) || '板块接口失败');
    var grp = (j.data && j.data[0]) || {};
    var fl  = grp.forumList || [];
    if(!fl.length) throw new Error('板块数据为空');
    $('#fCnt').textContent = fl.length + ' 个板块';

    function fcard(it){
      var ic = IMG(it.icon || '');
      return '<a class="fcard" href="javascript:;" data-fid="' + it.fid + '" data-nm="' + esc(it.name) + '">' +
        '<img src="' + ic + '" loading="lazy" alt="" onerror="this.style.opacity=.15">' +
        '<div class="fi"><div class="fn">' + esc(it.name) + '</div>' +
        '<div class="fs">主题 ' + num(it.threads) + ' · 帖 ' + num(it.posts) + '</div></div></a>';
    }
    var com = fl.filter(function(x){ return COM_FIDS.indexOf(String(x.fid)) >= 0; });
    var vid = fl.filter(function(x){ return VID_FIDS.indexOf(String(x.fid)) >= 0; });
    var rst = fl.filter(function(x){ return COM_FIDS.indexOf(String(x.fid)) < 0 && VID_FIDS.indexOf(String(x.fid)) < 0; });

    var h = '';
    if(com.length) h += '<div class="fgrp"><h4># 社区板块</h4><div class="gl">' + com.map(fcard).join('') + '</div></div>';
    if(vid.length) h += '<div class="fgrp"><h4># 视频板块</h4><div class="gl">' + vid.map(fcard).join('') + '</div></div>';
    if(rst.length) h += '<div class="fgrp"><h4># 全部板块</h4><div class="gl">' + rst.map(fcard).join('') + '</div></div>';
    $('#fBody').innerHTML = h;

    $('#fBody').addEventListener('click', function(e){
      var a = e.target.closest('.fcard'); if(!a) return;
      showList(a.dataset.fid, a.dataset.nm, 'forum');
    });
  }).catch(function(e){
    $('#fBody').innerHTML = '<div class="empty"><div class="big">⚠</div>板块加载失败：' + esc(e.message) +
      '<br><br><button onclick="showForum(1)" style="border:0;background:#14b886;color:#fff;padding:9px 22px;border-radius:20px;font-size:14px">重试</button></div>';
  });
}

/* ═══════════ 板块列表 / 搜索结果 ═══════════ */
var L = { fid:'', kw:'', page:1, end:false, loading:false, back:'home', io:null, per:10 };
var DEVBAG = [];

function newDev(){
  var s = '', h = '0123456789abcdef';
  for(var i = 0; i < 25; i++) s += h[Math.floor(Math.random() * 16)];
  return s;
}

function listShell(title, back){
  L.back = back || 'home';
  L.page = 1; L.end = false; L.loading = false;
  showView('list');
  $('#list').innerHTML =
    '<div class="lh"><button class="bk" id="lBack">‹</button>' +
    '<div class="t" id="lTitle">' + esc(title) + '</div><span class="cnt" id="lCnt"></span></div>' +
    '<div class="wrap" id="lFeed"></div><div id="lSent" style="height:1px"></div>';
  $('#lBack').onclick = function(){
    if(L.back === 'forum'){ showForum(); } else { showView('home'); setTab('home'); }
  };
  if(L.io){ L.io.disconnect(); L.io = null; }
  if(window.IntersectionObserver){
    L.io = new IntersectionObserver(function(es){
      es.forEach(function(en){ if(en.isIntersecting) loadList(); });
    }, { rootMargin: '600px' });
    L.io.observe($('#lSent'));
  } else {
    window.addEventListener('scroll', function(){
      if(CUR === 'list' && window.innerHeight + window.scrollY > document.body.offsetHeight - 800) loadList();
    });
  }
}

function showList(fid, name, back){
  L.fid = String(fid); L.kw = '';
  listShell(name || '板块', back || 'home');
  loadList();
}

function doSearch(kw){
  kw = (kw || '').trim();
  if(!kw){ tip('先输入关键词'); return; }
  L.fid = ''; L.kw = kw;
  listShell('搜索：' + kw, 'home');
  loadList();
}

function loadList(){
  if(L.loading || L.end) return;
  L.loading = true;
  if(L.page === 1) $('#lFeed').innerHTML = skeleton(3);

  var req;
  if(L.kw){
    req = apiGet('cearch.search', { page: L.page, perpage: L.per, keywords: L.kw, isUser: 'false', type: 'all' }, newDev());
  } else {
    req = apiGet('postlist.getThreadList', {
      page: L.page, perpage: L.per, fid: L.fid, tabsid: 'new', filter: 'lastpost', orderby: '', fidpw: ''
    });
  }

  req.then(function(j){
    if(!j) throw new Error('空响应');
    /* 搜索次数用尽 → 换设备号重试一次（服务端按 deviceid 计次） */
    if(j.code == 20011 && L.kw && !L._retried){
      L._retried = true;
      L.loading = false;
      return apiGet('cearch.search', { page: L.page, perpage: L.per, keywords: L.kw, isUser: 'false', type: 'all' }, newDev())
        .then(function(j2){ L.loading = true; return j2; });
    }
    if(j.code != 200) throw new Error(j.msg || ('接口返回 ' + j.code));
    var d = j.data || {};
    var list, next;
    if(L.kw){ list = d.threads || []; next = !!d.threads_next; }
    else    { list = d.list || [];    next = !!d.nextPage; }
    if(!L.kw && L.page === 1 && d.forum && d.forum.name) $('#lTitle').textContent = d.forum.name;

    if(L.page === 1) $('#lFeed').innerHTML = '';
    if(!list.length){
      L.end = true;
      if(L.page === 1) $('#lFeed').innerHTML = '<div class="empty"><div class="big">🗒</div>' +
        (L.kw ? '没有搜到「' + esc(L.kw) + '」相关内容' : '这个板块暂时没有内容') + '</div>';
      else $('#lFeed').insertAdjacentHTML('beforeend', '<div class="end">— 到底了 —</div>');
      return;
    }
    var h = '';
    list.forEach(function(it){ S.byTid[it.tid] = it; h += cardHTML(it); });
    $('#lFeed').insertAdjacentHTML('beforeend', h);
    $('#lCnt').textContent = '第 ' + L.page + ' 页';
    if(!next || list.length < L.per){
      L.end = true;
      $('#lFeed').insertAdjacentHTML('beforeend', '<div class="end">— 到底了 —</div>');
    } else {
      L.page++;
    }
  }).catch(function(e){
    console.error(e);
    if(L.page === 1) $('#lFeed').innerHTML = '<div class="empty"><div class="big">⚠</div>加载失败：' + esc(e.message) +
      '<br><br><button onclick="loadList()" style="border:0;background:#14b886;color:#fff;padding:9px 22px;border-radius:20px;font-size:14px">重试</button></div>';
    else tip('加载失败：' + e.message);
  }).then(function(){ L.loading = false; });
}

function setTab(t){
  $$('#tab button').forEach(function(b){ b.classList.toggle('on', b.dataset.t === t); });
}

/* ═══════════ 底部栏 ═══════════ */
$('#tab').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.classList.contains('mid')){ tip('发帖需要登录，本复原版未还原'); return; }
  var t = b.dataset.t;
  if(t === 'home'){
    showView('home'); setTab('home');
    if(location.hash) history.replaceState({}, '', location.pathname);
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  if(t === 'video'){ setTab('video'); showForum(); return; }
  setTab(t);
  tip('「' + b.textContent.trim() + '」页面需要登录，本复原版未还原');
});

/* ═══════════ 提示 ═══════════ */
function tip(msg){
  var t = $('#tip');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(tip._t);
  tip._t = setTimeout(function(){ t.classList.remove('on'); }, 2000);
}

/* ═══════════ 搜索框（本地过滤） ═══════════ */
var qTimer = 0, qLast = '';
$('#q').addEventListener('input', function(){
  var kw = this.value.trim();
  clearTimeout(qTimer);
  if(!kw){ qLast = ''; if(CUR === 'list' && L.kw){ showView('home'); setTab('home'); } return; }
  qTimer = setTimeout(function(){
    if(kw === qLast) return;
    qLast = kw;
    doSearch(kw);
  }, 420);
});
$('#q').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    clearTimeout(qTimer);
    var kw = this.value.trim();
    qLast = kw;
    if(kw){ this.blur(); doSearch(kw); }
  }
});

/* ═══════════ 无限滚动 ═══════════ */
if(window.IntersectionObserver){
  new IntersectionObserver(function(es){
    es.forEach(function(en){ if(en.isIntersecting) load(); });
  }, { rootMargin: '600px' }).observe($('#sentinel'));
} else {
  window.addEventListener('scroll', function(){
    if(window.innerHeight + window.scrollY > document.body.offsetHeight - 800) load();
  });
}

/* ═══════════ 启动 ═══════════ */
buildTabs(); buildGrid(); hotPlaceholder();
setInterval(hotPlaceholder, 12000);
load();

/* logo：用第一格图标当站标 */
$('#logoImg').src = IMG(GRID_BASE + 'img/fqrzjy.png');
$('#logoImg').onerror = function(){ this.style.display = 'none'; };

/* 返回键 */
window.addEventListener('popstate', function(){
  if(CUR === 'detail'){ closeDetail(); return; }
  if(CUR === 'list' || CUR === 'forum'){ showView('home'); setTab('home'); }
});

</script>
